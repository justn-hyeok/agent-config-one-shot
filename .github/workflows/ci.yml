name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and build tools
        run: python -m pip install . build
      - name: Verify isolated workflows
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel
        run: python scripts/verify_package.py dist/*.whl --source dist/*.tar.gz
